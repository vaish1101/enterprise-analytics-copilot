<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1040" viewBox="0 0 1360 1040" role="img" aria-labelledby="title desc">
<title id="title">Enterprise Analytics Copilot technical architecture</title>
<desc id="desc">React validates responses. FastAPI applies schema and peer quota controls. A catalog-grounded planner invokes analytics or authorized metadata-filtered MiniLM retrieval. Assembled evidence enters synthesis, verification, bounded revision and controlled release. Derived data, private pgvector storage, persistence and the external provider are separate boundaries. Public CI is credential-free and excludes held evaluators.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7d8b96"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#17232d}.h{font-size:23px;font-weight:600}.s{font-size:18px;fill:#52616c}.k{font-size:14px;letter-spacing:2px;fill:#51616e}.n{fill:white;stroke:#d7dfe4;stroke-width:1.5}.f{fill:none;stroke:#7d8b96;stroke-width:2;marker-end:url(#a)}.private{stroke-dasharray:6 5}</style></defs>
<rect width="1360" height="1040" rx="20" fill="#f5f6f7"/><text x="48" y="54" class="k">TECHNICAL ARCHITECTURE · NUMERICAL AND DOCUMENTARY AUTHORITY STAY SEPARATE</text><text x="48" y="103" font-size="34" font-weight="600">Bounded execution. Two release boundaries.</text>
<rect x="48" y="156" width="346" height="110" rx="14" class="n"/><text x="72" y="193" class="h">React / TypeScript</text><text x="72" y="224" class="s">Question, figures, evidence</text><text x="72" y="251" class="s">Runtime response validation</text><path d="M394 211H455" class="f"/>
<rect x="460" y="156" width="368" height="110" rx="14" class="n"/><text x="484" y="193" class="h">FastAPI request boundary</text><text x="484" y="224" class="s">Schema · length · peer quota</text><text x="484" y="251" class="s">Bounded request handling</text><path d="M828 211H891" class="f"/>
<rect x="896" y="156" width="416" height="110" rx="14" class="n"/><text x="920" y="193" class="h">Deterministic planner / router</text><text x="920" y="224" class="s">Catalog-grounded analytical operation</text><text x="920" y="251" class="s">Clarifies or rejects missing coverage</text>
<path d="M1104 266V303H264V344" class="f"/><path d="M1104 266V344" class="f"/>
<rect x="48" y="350" width="432" height="118" rx="14" class="n"/><text x="72" y="387" class="h">Governed analytics</text><text x="72" y="418" class="s">Fact lookup · Decimal calculation</text><text x="72" y="445" class="s">Reviewed decomposition / reconciliation</text>
<rect x="880" y="350" width="432" height="118" rx="14" class="n private"/><text x="904" y="387" class="h">Authorized knowledge retrieval</text><text x="904" y="418" class="s">Metadata filters → MiniLM dense top-5</text><text x="904" y="445" class="s">Absent in the numerical public demo</text>
<path d="M264 468V513H645V538" class="f"/><path d="M1096 468V513H645V538" class="f"/>
<rect x="440" y="544" width="412" height="98" rx="14" class="n"/><text x="464" y="580" class="h">Evidence assembly</text><text x="464" y="610" class="s">Fact/run lineage + selected source units</text><path d="M645 642V686" class="f"/>
<rect x="440" y="692" width="412" height="98" rx="14" class="n"/><text x="464" y="728" class="h">Structured synthesis</text><text x="464" y="758" class="s">Typed draft · one eligible revision</text><path d="M645 790V832" class="f"/>
<rect x="440" y="838" width="412" height="120" rx="14" fill="#e8f3ee" stroke="#b5d6c7"/><text x="464" y="875" class="h">Verification + controlled release</text><text x="464" y="906" class="s">Identity · values · units · provenance</text><text x="464" y="933" class="s">Bound text / subset / clarify / refuse</text>
<rect x="48" y="544" width="326" height="130" rx="14" class="n"/><text x="72" y="580" class="h">Governed assets</text><text x="72" y="611" class="s">Derived numerical CSV facts</text><text x="72" y="638" class="s">Catalog + schema contracts</text><text x="72" y="660" font-size="15" fill="#52616c">Public; no raw source documents</text><path d="M212 544V474" class="f"/>
<rect x="936" y="544" width="376" height="130" rx="14" class="n private"/><text x="960" y="580" class="h">Private documentary store</text><text x="960" y="611" class="s">PostgreSQL + pgvector / HNSW</text><text x="960" y="638" class="s">Authorized corpus + model cache</text><text x="960" y="660" font-size="15" fill="#52616c">Local MiniLM store also supported</text><path d="M1124 544V474" class="f"/>
<rect x="936" y="714" width="376" height="116" rx="14" class="n private"/><text x="960" y="750" class="h">External LLM provider</text><text x="960" y="780" class="s">OpenAI Structured Outputs</text><text x="960" y="807" class="s">Public demo uses a template instead</text><path d="M936 753H858" class="f"/>
<rect x="48" y="730" width="326" height="128" rx="14" class="n"/><text x="72" y="766" class="h">Runtime persistence</text><text x="72" y="797" class="s">SQLite or PostgreSQL</text><text x="72" y="824" class="s">Sessions + graph checkpoints</text><text x="72" y="846" font-size="15" fill="#52616c">Local state, never a public asset</text><path d="M374 794H406V594H434" class="f"/>
<rect x="48" y="978" width="1264" height="40" rx="10" fill="#e6ebef"/><text x="72" y="1005" class="s">Tests: public contracts + UI + safety; authorized integration is separate; held evaluations are not rerun.</text>
</svg>
